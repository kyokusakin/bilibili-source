name: Publish

on:
  push:
    tags:
      - bilibili-source-*
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Action
    env:
      ORG_GRADLE_PROJECT_centralPortalUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
      ORG_GRADLE_PROJECT_centralPortalPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
      CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
      CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Central namespace
        if: github.event_name != 'release'
        id: central
        shell: bash
        run: |
          namespace="$(grep '^centralNamespace=' gradle.properties | cut -d '=' -f 2-)"
          if [ -z "${namespace}" ]; then
            namespace="$(grep '^pluginGroup=' gradle.properties | cut -d '=' -f 2-)"
          fi
          if [ -z "${namespace}" ]; then
            echo "Unable to determine Central namespace" >&2
            exit 1
          fi

          echo "CENTRAL_NAMESPACE=${namespace}" >> "${GITHUB_ENV}"
          echo "namespace=${namespace}" >> "${GITHUB_OUTPUT}"

      - name: Validate Central publishing secrets
        if: github.event_name != 'release'
        shell: bash
        run: |
          missing=()
          [ -n "${CENTRAL_PORTAL_USERNAME}" ] || missing+=("CENTRAL_PORTAL_USERNAME")
          [ -n "${CENTRAL_PORTAL_PASSWORD}" ] || missing+=("CENTRAL_PORTAL_PASSWORD")
          [ -n "${ORG_GRADLE_PROJECT_signingInMemoryKey}" ] || missing+=("SIGNING_IN_MEMORY_KEY")
          [ -n "${ORG_GRADLE_PROJECT_signingPassword}" ] || missing+=("SIGNING_PASSWORD")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub secrets for Central publishing: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Build
        run: ./gradlew clean build --no-daemon

      - name: Publish to Sonatype Central
        if: github.event_name != 'release'
        run: ./gradlew publish --no-daemon

      - name: Promote release deployment to Central Portal
        if: github.event_name != 'release' && startsWith(github.ref, 'refs/tags/bilibili-source-')
        run: |
          auth_token=$(printf '%s' "${CENTRAL_PORTAL_USERNAME}:${CENTRAL_PORTAL_PASSWORD}" | base64 | tr -d '\n')
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${auth_token}" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${{ steps.central.outputs.namespace }}?publishing_type=automatic"

      - name: Upload common artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-common.jar
          path: common/build/libs/bilibili-common-*.jar

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-plugin.jar
          path: plugin/build/libs/bilibili-plugin-*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download common artifact
        uses: actions/download-artifact@v4
        with:
          name: bilibili-common.jar
          path: release-artifacts/common

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: bilibili-plugin.jar
          path: release-artifacts/plugin

      - name: Upload artifacts to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-artifacts/common/*.jar,release-artifacts/plugin/*.jar"
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
