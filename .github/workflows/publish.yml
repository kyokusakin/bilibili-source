name: Publish

on:
  push:
    tags:
      - bilibili-source-*
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_centralPortalUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
      ORG_GRADLE_PROJECT_centralPortalPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
      CENTRAL_NAMESPACE: ${{ vars.CENTRAL_NAMESPACE }}
      CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
      CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew clean build --no-daemon

      - name: Publish to Sonatype Central
        if: github.event_name != 'release'
        run: ./gradlew publish --no-daemon

      - name: Promote release deployment to Central Portal
        if: github.event_name != 'release' && startsWith(github.ref, 'refs/tags/bilibili-source-')
        run: |
          auth_token=$(printf '%s' "${CENTRAL_PORTAL_USERNAME}:${CENTRAL_PORTAL_PASSWORD}" | base64 -w 0)
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${auth_token}" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${CENTRAL_NAMESPACE}?publishing_type=automatic"

      - name: Upload common artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-common.jar
          path: common/build/libs/bilibili-common-*.jar

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-plugin.jar
          path: plugin/build/libs/bilibili-plugin-*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download common artifact
        uses: actions/download-artifact@v4
        with:
          name: bilibili-common.jar
          path: release-artifacts/common

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: bilibili-plugin.jar
          path: release-artifacts/plugin

      - name: Upload artifacts to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-artifacts/common/*.jar,release-artifacts/plugin/*.jar"
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
